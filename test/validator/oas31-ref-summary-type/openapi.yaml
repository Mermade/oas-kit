openapi: 3.1.0
info:
  title: Reference summary must be a string
  version: 1.0.0
paths:
  /pets/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
        summary: 404
    get:
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      requestBody:
        $ref: '#/components/requestBodies/Pet'

      responses:
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: string
  requestBodies:
    Pet:
      content:
        application/json:
          schema:
            type: object
  responses:
    NotFound:
      description: Not found
