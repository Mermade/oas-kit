openapi: 3.1.0
info:
  title: mutualTLS security scheme
  version: 1.0.0
paths:
  /admin:
    get:
      security:
        - clientCert: [admin]
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    clientCert:
      type: mutualTLS
      description: Client certificate issued by our CA

